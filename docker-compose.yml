# Stack completo para correr localmente con Docker (API + frontend).
# Uso:
#   docker compose up -d --build
#   Frontend: http://localhost:8080  |  API: http://localhost:8000
#
# Por defecto la API usa SQLite en un volumen (api_data). Postgres es
# opcional (perfil "postgres"), pensado como paso previo a un despliegue
# tipo Azure — no se levanta a menos que lo pidas explicitamente:
#   docker compose --profile postgres up -d
#   (requiere POSTGRES_PASSWORD en .env, ver .env.example, y
#    apuntar DATABASE_URL=postgresql://<user>:<password>@db:5432/<db>)
services:
  api:
    build: ./api
    container_name: tt_api
    ports:
      - "8000:8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      FLASK_DEBUG: 0
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/trading_system.db}
    volumes:
      - api_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: tt_frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: tt_postgres
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user_admin}
      # OJO: cambia este default en .env antes de usar --profile postgres
      # de verdad. No se puede usar la sintaxis "variable requerida" (${VAR:?...})
      # aqui porque Compose interpola TODOS los servicios (incluso los de un
      # profile inactivo) al correr `docker compose up`/`config`, y eso rompia
      # el comando por defecto (solo api+frontend) si POSTGRES_PASSWORD no estaba fijado.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-using-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stocks_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  api_data:
  postgres_data:
