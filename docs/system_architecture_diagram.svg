<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Arquitectura del sistema — TT 2026-B164 (estado al 2026-09-30)</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="1000" height="660" fill="#ffffff"/>

  <text x="500" y="30" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Arquitectura del sistema — TT 2026-B164</text>
  <text x="500" y="50" text-anchor="middle" font-size="12" fill="#64748b">Estado al 30 de septiembre de 2026</text>

  <!-- Fuentes de datos -->
  <rect x="30" y="80" width="220" height="140" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="140" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">Yahoo Finance (yfinance)</text>
  <text x="44" y="130" font-size="12" fill="#1e293b">• OHLCV diario ajustado de</text>
  <text x="56" y="146" font-size="12" fill="#1e293b">AAPL, NVDA, TSLA, AMZN,</text>
  <text x="56" y="162" font-size="12" fill="#1e293b">MSFT, GOOGL, META</text>
  <text x="44" y="184" font-size="12" fill="#1e293b">• Contexto de mercado:</text>
  <text x="56" y="200" font-size="12" fill="#1e293b">SPY y ^VIX</text>

  <!-- Investigación offline -->
  <rect x="290" y="70" width="420" height="180" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="500" y="94" text-anchor="middle" font-size="14" font-weight="700" fill="#4c1d95">Investigación (offline) — scripts_opt/</text>
  <text x="306" y="120" font-size="12" fill="#1e293b">• Dataset 2014–2025: 61 indicadores + etiqueta 30/70 rodante (1 día)</text>
  <text x="306" y="140" font-size="12" fill="#1e293b">• 5 modelos: Reg. Logística, XGBoost, LSTM, CNN 1D, CNN-LSTM</text>
  <text x="306" y="160" font-size="12" fill="#1e293b">• Global y por acción · Optuna · IC bootstrap · walk-forward</text>
  <text x="306" y="180" font-size="12" fill="#1e293b">• Ganador: Regresión Logística global (+15 interacciones)</text>
  <text x="306" y="200" font-size="12" fill="#1e293b">• Ajuste de HOLD por origen rodante 2019–2024</text>
  <text x="306" y="228" font-size="12" font-style="italic" fill="#6d28d9">entrenar_produccion.py → reentrena con 2018–2025</text>

  <!-- Artefacto -->
  <rect x="750" y="90" width="220" height="140" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="860" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="#713f12">Modelo empaquetado</text>
  <text x="764" y="138" font-size="12" fill="#1e293b">api/ml/artifacts/ (.pkl)</text>
  <text x="764" y="160" font-size="12" fill="#1e293b">• LR L2, C = 1.65e-4</text>
  <text x="764" y="178" font-size="12" fill="#1e293b">• 76 variables, RobustScaler</text>
  <text x="764" y="196" font-size="12" fill="#1e293b">• Pesos balanced, HOLD ×0.90</text>
  <text x="764" y="216" font-size="11" fill="#64748b">LR-v8-interactions-holdw090</text>

  <!-- API -->
  <rect x="290" y="320" width="420" height="250" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="500" y="344" text-anchor="middle" font-size="14" font-weight="700" fill="#064e3b">API REST — Flask + gunicorn (api/)</text>
  <text x="306" y="370" font-size="12" font-weight="600" fill="#065f46">initialize_data(): al arrancar, L–V 16:30 (Nueva York)</text>
  <text x="318" y="388" font-size="12" fill="#1e293b">y reintento cada 2 min si falta alguna acción</text>
  <text x="306" y="410" font-size="12" fill="#1e293b">1. Descarga ~3 años (sin la vela intradía si NYSE abierto)</text>
  <text x="306" y="428" font-size="12" fill="#1e293b">2. features.py: 61 indicadores + 15 interacciones</text>
  <text x="306" y="446" font-size="12" fill="#1e293b">3. model.py: probabilidades y señal de cada día</text>
  <text x="306" y="464" font-size="12" fill="#1e293b">4. target.py: resultado real del día siguiente</text>
  <text x="306" y="482" font-size="12" fill="#1e293b">5. Métricas 30/60/90 días (F1, Sharpe, drawdown…)</text>
  <text x="306" y="508" font-size="12" font-weight="600" fill="#065f46">Endpoints</text>
  <text x="306" y="526" font-size="11.5" fill="#1e293b">/stocks · /stocks/:s · /history · /metrics?days= · /model</text>
  <text x="306" y="543" font-size="11.5" fill="#1e293b">/market-status · /health · POST /admin/refresh</text>
  <text x="306" y="560" font-size="11" fill="#64748b">Overrides manuales desactivados (403)</text>

  <!-- SQLite -->
  <rect x="30" y="360" width="220" height="170" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="140" y="384" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">SQLite (SQLAlchemy)</text>
  <text x="44" y="410" font-size="12" fill="#1e293b">• assets</text>
  <text x="44" y="428" font-size="12" fill="#1e293b">• ohlcv_daily</text>
  <text x="44" y="446" font-size="12" fill="#1e293b">• predictions (señal, 3</text>
  <text x="56" y="462" font-size="12" fill="#1e293b">probabilidades, acierto)</text>
  <text x="44" y="480" font-size="12" fill="#1e293b">• metrics (30/60/90 días)</text>
  <text x="44" y="510" font-size="11" fill="#64748b">Reconstruible desde Yahoo + .pkl</text>

  <!-- Frontend -->
  <rect x="750" y="330" width="220" height="230" rx="10" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="860" y="354" text-anchor="middle" font-size="14" font-weight="700" fill="#881337">Frontend (Frontend/)</text>
  <text x="764" y="378" font-size="12" fill="#1e293b">React + TypeScript + Vite</text>
  <text x="764" y="396" font-size="12" fill="#1e293b">PWA (service worker</text>
  <text x="776" y="412" font-size="12" fill="#1e293b">network-first)</text>
  <text x="764" y="438" font-size="12" font-weight="600" fill="#9f1239">Páginas</text>
  <text x="764" y="456" font-size="12" fill="#1e293b">• Señales del día</text>
  <text x="764" y="474" font-size="12" fill="#1e293b">• Detalle por acción</text>
  <text x="764" y="492" font-size="12" fill="#1e293b">• Rendimiento global</text>
  <text x="764" y="510" font-size="12" fill="#1e293b">• Acerca de (ficha del</text>
  <text x="776" y="526" font-size="12" fill="#1e293b">modelo vía /model)</text>

  <!-- Flechas -->
  <line x1="250" y1="140" x2="286" y2="140" stroke="#475569" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="268" y="132" text-anchor="middle" font-size="10" fill="#475569">histórico</text>
  <line x1="710" y1="160" x2="746" y2="160" stroke="#475569" stroke-width="1.6" marker-end="url(#flecha)"/>
  <line x1="860" y1="230" x2="860" y2="290" stroke="#475569" stroke-width="1.6"/>
  <line x1="860" y1="290" x2="640" y2="290" stroke="#475569" stroke-width="1.6"/>
  <line x1="640" y1="290" x2="640" y2="316" stroke="#475569" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="750" y="284" text-anchor="middle" font-size="11" fill="#475569">se carga al arrancar</text>
  <line x1="140" y1="220" x2="140" y2="285" stroke="#475569" stroke-width="1.6"/>
  <line x1="140" y1="285" x2="360" y2="285" stroke="#475569" stroke-width="1.6"/>
  <line x1="360" y1="285" x2="360" y2="316" stroke="#475569" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="250" y="278" text-anchor="middle" font-size="11" fill="#475569">descarga diaria (en vivo)</text>
  <line x1="286" y1="445" x2="254" y2="445" stroke="#475569" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="270" y="437" text-anchor="middle" font-size="10" fill="#475569">upsert</text>
  <line x1="714" y1="445" x2="746" y2="445" stroke="#475569" stroke-width="1.6" marker-end="url(#flecha)"/>
  <text x="730" y="437" text-anchor="middle" font-size="10" fill="#475569">JSON</text>

  <!-- Pie -->
  <rect x="30" y="595" width="940" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="500" y="614" text-anchor="middle" font-size="12" fill="#334155">Despliegue en Render desde la rama main: tt-api (Docker, 1 instancia) y tt-frontend (static site con VITE_API_URL).</text>
  <text x="500" y="631" text-anchor="middle" font-size="12" fill="#334155">Los datos mostrados vienen solo de Yahoo Finance y del modelo; nada se simula.</text>
</svg>
