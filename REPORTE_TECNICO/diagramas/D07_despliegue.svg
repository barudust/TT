<text x="180.0" y="421.4" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">render.yaml (Blueprint)</text>
<rect x="30.0" y="520.0" width="300.0" height="200.0" rx="10" fill="#ffffff" stroke="#1f8a4c" stroke-width="1.5"/>
