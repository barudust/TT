<text x="365.0" y="372.0" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle">push</text>
<rect x="400.0" y="40.0" width="820.0" height="800.0" rx="16" fill="none" stroke="#c3cad6" stroke-width="1.6" stroke-dasharray="7 6"/>
<rect x="418.0" y="30.0" width="313.0" height="20" fill="#ffffff"/>
<text x="426.0" y="45.0" font-size="13" fill="#6b7280" font-weight="bold" text-anchor="start">RENDER · plan gratuito · despliegue automático</text>
<rect x="440.0" y="95.0" width="740.0" height="370.0" rx="10" fill="#eaf2fd" stroke="#2a78d6" stroke-width="2"/>
<text x="465.0" y="135.0" font-size="19" fill="#1c518f" font-weight="bold" text-anchor="start">tt-api · servicio web (Docker)</text>
<text x="470.0" y="175.0" font-size="14.5" fill="#1f2937" font-weight="normal" text-anchor="start">• imagen python:3.13-slim · versiones fijas (scikit-learn 1.7.2)</text>
<text x="470.0" y="211.0" font-size="14.5" fill="#1f2937" font-weight="normal" text-anchor="start">• gunicorn --workers 1 --timeout 300 wsgi:app</text>
<text x="470.0" y="247.0" font-size="14.5" fill="#1f2937" font-weight="normal" text-anchor="start">• 1 instancia: el programador de tareas vive en el proceso</text>
<text x="470.0" y="283.0" font-size="14.5" fill="#1f2937" font-weight="normal" text-anchor="start">• SQLite en /data: efímera, se reconstruye al arrancar</text>
<text x="470.0" y="319.0" font-size="14.5" fill="#1f2937" font-weight="normal" text-anchor="start">• variables: DATABASE_URL, REFRESH_HOUR = 16, REFRESH_MINUTE = 30</text>
<text x="470.0" y="355.0" font-size="14.5" fill="#1f2937" font-weight="normal" text-anchor="start">• ruta de salud: /health</text>
<rect x="470.0" y="405.0" width="251.0" height="23" rx="11.5" fill="#ffffff"/>
<text x="595.5" y="420.5" font-size="13" fill="#1c518f" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">https://tt-api-jc7n.onrender.com</text>
<rect x="440.0" y="500.0" width="740.0" height="300.0" rx="10" fill="#eaf2fd" stroke="#2a78d6" stroke-width="2"/>
<text x="465.0" y="540.0" font-size="19" fill="#1c518f" font-weight="bold" text-anchor="start">tt-frontend · sitio estático</text>
<text x="470.0" y="580.0" font-size="14.5" fill="#1f2937" font-weight="normal" text-anchor="start">• compila: cd Frontend &amp;&amp; npm ci &amp;&amp; npm run build</text>
<text x="470.0" y="616.0" font-size="14.5" fill="#1f2937" font-weight="normal" text-anchor="start">• publica: Frontend/dist (siempre disponible, sin dormir)</text>
<text x="470.0" y="652.0" font-size="14.5" fill="#1f2937" font-weight="normal" text-anchor="start">• regla: /* → /index.html (navegación de React)</text>
<text x="470.0" y="688.0" font-size="14.5" fill="#1f2937" font-weight="normal" text-anchor="start">• VITE_API_URL = URL de tt-api (se fija en el panel)</text>
<rect x="470.0" y="740.0" width="287.4" height="23" rx="11.5" fill="#ffffff"/>
<text x="613.7" y="755.5" font-size="13" fill="#1c518f" font-weight="bold" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">https://tt-frontend-womf.onrender.com</text>
