<text x="1235.0" y="605.0" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle">HTTPS</text>
<path d="M1360.0,560.0 L1360.0,420.0 L1180.0,420.0" fill="none" stroke="#8a94a6" stroke-width="1.8" marker-end="url(#flecha)"/>
<rect x="1296.1" y="458.1" width="87.7" height="16.9" fill="#ffffff" rx="3"/>
<text x="1340.0" y="470.0" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle">JSON + CORS</text>
<rect x="1240.0" y="700.0" width="330.0" height="140.0" rx="10" fill="#fdf3e1" stroke="#c27c0e" stroke-width="1.5"/>
<text x="1405.0" y="739.1" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Plan gratuito</text>
<text x="1405.0" y="757.7" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">se duerme tras ~15 min sin tráfico</text>
<text x="1405.0" y="775.7" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">primera carga: 20–40 s</text>
<text x="1405.0" y="793.6" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">la actualización corre solo</text>
<text x="1405.0" y="811.6" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">si el servicio está despierto</text>
