<rect x="1203.0" y="183.1" width="64.0" height="16.9" fill="#ffffff" rx="3"/>
<text x="1235.0" y="195.0" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle">descarga</text>
<path d="M1290.0,615.0 L1180.0,615.0" fill="none" stroke="#8a94a6" stroke-width="1.8" marker-end="url(#flecha)"/>
