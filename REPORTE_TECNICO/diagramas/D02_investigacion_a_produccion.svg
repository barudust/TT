<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="Arial, Helvetica, sans-serif">
<title>Del dataset al modelo en producción</title>
<defs>
  <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
  </marker>
  <marker id="flecha-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
  </marker>
  <marker id="flecha-naranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/>
  </marker>
  <marker id="flecha-ambar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c27c0e"/>
  </marker>
  <pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#f3f4f6"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#9aa3ae" stroke-width="2"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>
<text x="40.0" y="50.0" font-size="15" fill="#6b7280" font-weight="bold" text-anchor="start">1 · Datos</text>
<rect x="40.0" y="70.0" width="260.0" height="120.0" rx="10" fill="#f3f4f6" stroke="#8a94a6" stroke-width="1.5"/>
<text x="170.0" y="116.0" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Yahoo Finance</text>
<text x="170.0" y="136.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">desde 2013-01-01</text>
<text x="170.0" y="155.3" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">auto_adjust = True</text>
<rect x="360.0" y="70.0" width="420.0" height="120.0" rx="10" fill="#f1f4f8" stroke="#475569" stroke-width="1.5"/>
<text x="570.0" y="103.6" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle">scripts_v1/</text>
<text x="570.0" y="124.3" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">01_build_raw_dataset.py</text>
<text x="570.0" y="144.3" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">61 características en 9 familias</text>
<text x="570.0" y="163.6" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">etiqueta 30/70 (252 días, shift 1) · r_forward</text>
<rect x="840.0" y="70.0" width="420.0" height="120.0" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.5"/>
<text x="1050.0" y="103.6" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle">tesis_ml_stocks/01_raw_datasets/</text>
<text x="1050.0" y="124.3" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">7 archivos parquet</text>
<text x="1050.0" y="144.3" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">2013-12-31 a 2025-12-29 · 21 119 filas</text>
<text x="1050.0" y="163.6" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">2026 aparte, solo para la prueba ciega</text>
<rect x="1320.0" y="70.0" width="240.0" height="120.0" rx="10" fill="#f3f4f6" stroke="#9aa3ae" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="1440.0" y="108.1" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="middle">Etapas 1–2</text>
<text x="1440.0" y="126.7" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">scripts_v1/02–08</text>
<text x="1440.0" y="144.7" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">scripts_opt/opt_*.py</text>
<text x="1440.0" y="162.6" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">(antecedente)</text>
