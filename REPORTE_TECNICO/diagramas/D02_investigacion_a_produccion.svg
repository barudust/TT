<rect x="743.2" y="593.1" width="133.5" height="16.9" fill="#ffffff" rx="3"/>
<text x="810.0" y="605.0" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle">configuración elegida</text>
<path d="M470.0,745.0 L560.0,745.0" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#flecha-naranja)"/>
<path d="M1020.0,745.0 L1110.0,745.0" fill="none" stroke="#eb6834" stroke-width="2" marker-end="url(#flecha-naranja)"/>
<text x="800.0" y="870.0" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="middle">Para cambiar de modelo basta sustituir el .pkl y actualizar MODEL_VERSION; la API no cambia.</text>
</svg>
