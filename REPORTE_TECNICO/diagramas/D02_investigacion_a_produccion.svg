<path d="M780.0,130.0 L840.0,130.0" fill="none" stroke="#8a94a6" stroke-width="1.8" marker-end="url(#flecha)"/>
<text x="40.0" y="265.0" font-size="15" fill="#6b7280" font-weight="bold" text-anchor="start">2 · Comparación y decisiones (scripts_opt/)</text>
<rect x="40.0" y="285.0" width="340.0" height="250.0" rx="10" fill="#f1f4f8" stroke="#475569" stroke-width="1.5"/>
<text x="210.0" y="363.6" font-size="12" fill="#475569" font-weight="normal" text-anchor="middle">Etapa 3</text>
<text x="210.0" y="385.3" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">Igualdad de condiciones</text>
<text x="210.0" y="405.7" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">common_v4.py · train_all_v4.py</text>
<text x="210.0" y="425.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">61 variables para los cinco</text>
<text x="210.0" y="444.3" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">A/B/C con prueba 2025</text>
<text x="210.0" y="463.6" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">120 corridas</text>
<rect x="163.6" y="533.0" width="92.8" height="22" rx="11.0" fill="#475569"/>
<text x="210.0" y="547.5" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">paper §3–§7</text>
<rect x="425.0" y="285.0" width="340.0" height="250.0" rx="10" fill="#fdeee6" stroke="#eb6834" stroke-width="2.4"/>
<text x="595.0" y="363.6" font-size="12" fill="#eb6834" font-weight="normal" text-anchor="middle">Etapa 4</text>
<text x="595.0" y="385.3" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">Protocolo final</text>
<text x="595.0" y="405.7" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">common_v5.py · run_v5.py</text>
<text x="595.0" y="425.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">dev/final: nada con la prueba</text>
<text x="595.0" y="444.3" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">Optuna para los cinco</text>
<text x="595.0" y="463.6" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">IC bootstrap · costos · año por año</text>
<rect x="498.1" y="533.0" width="193.8" height="22" rx="11.0" fill="#eb6834"/>
<text x="595.0" y="547.5" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">paper §8 · resultado principal</text>
<rect x="810.0" y="285.0" width="340.0" height="250.0" rx="10" fill="#f1f4f8" stroke="#475569" stroke-width="1.5"/>
<text x="980.0" y="363.6" font-size="12" fill="#475569" font-weight="normal" text-anchor="middle">Etapa 5</text>
<text x="980.0" y="385.3" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">Búsqueda de mejoras</text>
<text x="980.0" y="405.7" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">via7_refinamiento.py</text>
<text x="980.0" y="425.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">via8_dataset.py</text>
<text x="980.0" y="444.3" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">calibración, mezclas, SWA…</text>
<text x="980.0" y="463.6" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">se adoptan 15 interacciones</text>
<rect x="1195.0" y="285.0" width="340.0" height="250.0" rx="10" fill="#f1f4f8" stroke="#475569" stroke-width="1.5"/>
<text x="1365.0" y="363.6" font-size="12" fill="#475569" font-weight="normal" text-anchor="middle">Etapa 6</text>
<text x="1365.0" y="385.3" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">Modelo de la plataforma</text>
<text x="1365.0" y="405.7" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">ajuste_hold_rolling.py</text>
<text x="1365.0" y="425.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">peso de mantener × 0.90</text>
<text x="1365.0" y="444.3" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">global contra por acción</text>
<text x="1365.0" y="463.6" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">prueba ciega 2026</text>
