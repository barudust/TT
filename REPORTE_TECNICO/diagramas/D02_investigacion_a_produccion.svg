<path d="M1150.0,410.0 L1195.0,410.0" fill="none" stroke="#8a94a6" stroke-width="1.8" marker-end="url(#flecha)"/>
<path d="M1050.0,190.0 L1050.0,240.0 L210.0,240.0 L210.0,285.0" fill="none" stroke="#8a94a6" stroke-width="1.8" marker-end="url(#flecha)"/>
<rect x="522.0" y="233.1" width="216.0" height="16.9" fill="#ffffff" rx="3"/>
<text x="630.0" y="245.0" font-size="12.5" fill="#6b7280" font-weight="normal" text-anchor="middle">mismos datos para todas las etapas</text>
<text x="40.0" y="640.0" font-size="15" fill="#6b7280" font-weight="bold" text-anchor="start">3 · Producción</text>
<rect x="40.0" y="660.0" width="430.0" height="170.0" rx="10" fill="#f1f4f8" stroke="#475569" stroke-width="1.5"/>
<text x="255.0" y="698.6" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle">scripts_opt/</text>
<text x="255.0" y="720.3" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">entrenar_produccion.py</text>
<text x="255.0" y="740.7" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">7 acciones, 2018–2025 (14 063 filas)</text>
<text x="255.0" y="760.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">+ 15 interacciones · RobustScaler global</text>
<text x="255.0" y="779.3" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">pesos balanceados, mantener × 0.90</text>
<text x="255.0" y="798.6" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">LogisticRegression(L2, C = 0.000165)</text>
<rect x="560.0" y="660.0" width="460.0" height="170.0" rx="10" fill="#fdeee6" stroke="#eb6834" stroke-width="1.5"/>
<text x="790.0" y="699.3" font-size="12" fill="#6b7280" font-weight="normal" text-anchor="middle">api/ml/artifacts/</text>
<text x="790.0" y="719.9" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">lr_elasticnet_global_expB.pkl</text>
<text x="790.0" y="740.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">modelo + escalador + 76 variables</text>
<text x="790.0" y="759.3" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">metadatos: versión, rango, evidencia</text>
<text x="790.0" y="778.6" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">+ .metrics.json · interaction_pairs.json</text>
<text x="790.0" y="797.9" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">(el nombre «elasticnet» es histórico)</text>
<rect x="1110.0" y="660.0" width="450.0" height="170.0" rx="10" fill="#eaf2fd" stroke="#2a78d6" stroke-width="1.5"/>
<text x="1335.0" y="712.0" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">API (api/ml/model.py)</text>
<text x="1335.0" y="732.4" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">carga el archivo una sola vez</text>
<text x="1335.0" y="751.7" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">verifica que estén las 76 variables</text>
<text x="1335.0" y="771.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">MODEL_VERSION = LR-v8-interactions-holdw090</text>
<text x="1335.0" y="790.3" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">una prueba exige que coincidan</text>
