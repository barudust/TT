<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" font-family="Arial, Helvetica, sans-serif">
<title>Etapas del proyecto</title>
<defs>
  <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#8a94a6"/>
  </marker>
  <marker id="flecha-azul" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
  </marker>
  <marker id="flecha-naranja" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/>
  </marker>
  <marker id="flecha-ambar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c27c0e"/>
  </marker>
  <pattern id="rayado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="8" height="8" fill="#f3f4f6"/>
    <line x1="0" y1="0" x2="0" y2="8" stroke="#9aa3ae" stroke-width="2"/>
  </pattern>
</defs>
<rect x="0" y="0" width="1600" height="620" fill="#ffffff"/>
<line x1="70.0" y1="210.0" x2="1530.0" y2="210.0" stroke="#c3cad6" stroke-width="4"/>
<path d="M1500.0,210.0 L1560.0,210.0" fill="none" stroke="#8a94a6" stroke-width="4" marker-end="url(#flecha)"/>
<text x="140.0" y="78.0" font-size="14" fill="#2a78d6" font-weight="bold" text-anchor="middle">Etapa 1</text>
<text x="140.0" y="104.0" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">Línea base (TT1)</text>
<text x="140.0" y="128.0" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="middle">hasta mayo</text>
<circle cx="140.0" cy="210.0" r="28" fill="#2a78d6" stroke="#ffffff" stroke-width="4"/>
<text x="140.0" y="218.0" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<rect x="20.0" y="280.0" width="240.0" height="262.0" rx="12" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5"/>
<text x="36.0" y="312.0" font-size="12.5" fill="#6b7280" font-weight="bold" text-anchor="start">Pregunta</text>
<text x="36.0" y="336.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">¿Funciona el sistema</text>
<text x="36.0" y="357.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">completo con 5 modelos?</text>
<text x="36.0" y="396.0" font-size="12.5" fill="#6b7280" font-weight="bold" text-anchor="start">Respuesta</text>
<text x="36.0" y="420.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Sí. XGBoost primero en F1,</text>
<text x="36.0" y="441.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">pero cada modelo recibía</text>
<text x="36.0" y="462.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">variables distintas</text>
<text x="404.0" y="78.0" font-size="14" fill="#2a78d6" font-weight="bold" text-anchor="middle">Etapa 2</text>
<text x="404.0" y="104.0" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">Primeras mejoras</text>
<text x="404.0" y="128.0" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="middle">mayo–junio</text>
<circle cx="404.0" cy="210.0" r="28" fill="#2a78d6" stroke="#ffffff" stroke-width="4"/>
<text x="404.0" y="218.0" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<rect x="284.0" y="280.0" width="240.0" height="262.0" rx="12" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5"/>
<text x="300.0" y="312.0" font-size="12.5" fill="#6b7280" font-weight="bold" text-anchor="start">Pregunta</text>
<text x="300.0" y="336.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">¿Se puede mejorar</text>
<text x="300.0" y="357.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">cada modelo?</text>
<text x="300.0" y="396.0" font-size="12.5" fill="#6b7280" font-weight="bold" text-anchor="start">Respuesta</text>
<text x="300.0" y="420.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Poco. Filtrar variables</text>
<text x="300.0" y="441.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">empeora en 11 de 15;</text>
<text x="300.0" y="462.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">falta un protocolo limpio</text>
<rect x="367.4" y="505.0" width="73.1" height="22.5" rx="11.25" fill="#475569"/>
<text x="404.0" y="520.0" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle">paper §6</text>
<text x="668.0" y="78.0" font-size="14" fill="#2a78d6" font-weight="bold" text-anchor="middle">Etapa 3</text>
<text x="668.0" y="104.0" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">Igualdad de condiciones</text>
<text x="668.0" y="128.0" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="middle">junio</text>
<circle cx="668.0" cy="210.0" r="28" fill="#2a78d6" stroke="#ffffff" stroke-width="4"/>
<text x="668.0" y="218.0" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<rect x="548.0" y="280.0" width="240.0" height="262.0" rx="12" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5"/>
<text x="564.0" y="312.0" font-size="12.5" fill="#6b7280" font-weight="bold" text-anchor="start">Pregunta</text>
<text x="564.0" y="336.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">¿Quién gana si todos</text>
<text x="564.0" y="357.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">reciben lo mismo?</text>
<text x="564.0" y="396.0" font-size="12.5" fill="#6b7280" font-weight="bold" text-anchor="start">Respuesta</text>
<text x="564.0" y="420.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">La LR (0.399), XGBoost</text>
<text x="564.0" y="441.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">cerca; 120 corridas con</text>
<text x="564.0" y="462.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">las mismas 61 variables</text>
<rect x="620.0" y="505.0" width="95.9" height="22.5" rx="11.25" fill="#475569"/>
<text x="668.0" y="520.0" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle">paper §3–§7</text>
<text x="932.0" y="78.0" font-size="14" fill="#eb6834" font-weight="bold" text-anchor="middle">Etapa 4</text>
<text x="932.0" y="104.0" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">Protocolo final</text>
<text x="932.0" y="128.0" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="middle">agosto</text>
<circle cx="932.0" cy="210.0" r="34" fill="#eb6834" stroke="#ffffff" stroke-width="4"/>
<text x="932.0" y="218.0" font-size="22" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
<rect x="812.0" y="280.0" width="240.0" height="262.0" rx="12" fill="#fdeee6" stroke="#eb6834" stroke-width="2.2"/>
<text x="828.0" y="312.0" font-size="12.5" fill="#6b7280" font-weight="bold" text-anchor="start">Pregunta</text>
<text x="828.0" y="336.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">¿Sobrevive a un protocolo</text>
<text x="828.0" y="357.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">estricto?</text>
<text x="828.0" y="396.0" font-size="12.5" fill="#6b7280" font-weight="bold" text-anchor="start">Respuesta</text>
<text x="828.0" y="420.0" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start">Sí: la LR gana con</text>
<text x="828.0" y="441.0" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start">significancia en A, B y C</text>
<text x="828.0" y="462.0" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start">(0.404 en B)</text>
<rect x="895.4" y="505.0" width="73.1" height="22.5" rx="11.25" fill="#eb6834"/>
<text x="932.0" y="520.0" font-size="12.5" fill="#ffffff" font-weight="bold" text-anchor="middle">paper §8</text>
<rect x="852.3" y="245.0" width="159.4" height="22" rx="11.0" fill="#eb6834"/>
<text x="932.0" y="259.5" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">RESULTADO PRINCIPAL</text>
<text x="1196.0" y="78.0" font-size="14" fill="#2a78d6" font-weight="bold" text-anchor="middle">Etapa 5</text>
<text x="1196.0" y="104.0" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">Búsqueda de mejoras</text>
<text x="1196.0" y="128.0" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="middle">fin de agosto</text>
<circle cx="1196.0" cy="210.0" r="28" fill="#2a78d6" stroke="#ffffff" stroke-width="4"/>
<text x="1196.0" y="218.0" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text>
<rect x="1076.0" y="280.0" width="240.0" height="262.0" rx="12" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5"/>
<text x="1092.0" y="312.0" font-size="12.5" fill="#6b7280" font-weight="bold" text-anchor="start">Pregunta</text>
<text x="1092.0" y="336.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">¿Algo más mejora sin</text>
<text x="1092.0" y="357.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">cambiar el problema?</text>
<text x="1092.0" y="396.0" font-size="12.5" fill="#6b7280" font-weight="bold" text-anchor="start">Respuesta</text>
<text x="1092.0" y="420.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Casi nada; se adoptan</text>
<text x="1092.0" y="441.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">15 interacciones como</text>
<text x="1092.0" y="462.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">equivalentes</text>
<text x="1460.0" y="78.0" font-size="14" fill="#2a78d6" font-weight="bold" text-anchor="middle">Etapa 6</text>
<text x="1460.0" y="104.0" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="middle">Plataforma y validación</text>
<text x="1460.0" y="128.0" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="middle">septiembre–octubre</text>
<circle cx="1460.0" cy="210.0" r="28" fill="#2a78d6" stroke="#ffffff" stroke-width="4"/>
<text x="1460.0" y="218.0" font-size="19" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text>
<rect x="1340.0" y="280.0" width="240.0" height="262.0" rx="12" fill="#ffffff" stroke="#c3cad6" stroke-width="1.5"/>
<text x="1356.0" y="312.0" font-size="12.5" fill="#6b7280" font-weight="bold" text-anchor="start">Pregunta</text>
<text x="1356.0" y="336.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">¿Cómo se comporta con</text>
<text x="1356.0" y="357.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">datos nuevos?</text>
<text x="1356.0" y="396.0" font-size="12.5" fill="#6b7280" font-weight="bold" text-anchor="start">Respuesta</text>
<text x="1356.0" y="420.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Se corrige el exceso de</text>
<text x="1356.0" y="441.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">mantener; 2026: LR</text>
<text x="1356.0" y="462.0" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">primera en clasificación</text>
<text x="800.0" y="590.0" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="middle">Los Experimentos A, B y C se repiten dentro de las etapas 1 a 4: no son etapas. Cada etapa es una vuelta del ciclo de CRISP-DM.</text>
</svg>
