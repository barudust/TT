<text x="90.0" y="520.0" font-size="15" fill="#475569" font-weight="bold" text-anchor="start">Regla (scripts_v1/01_build_raw_dataset.py y api/ml/target.py)</text>
<text x="90.0" y="560.0" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">r_fwd = ln(close.shift(-1) / close)</text>
<text x="1510.0" y="560.0" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="end">retorno del día siguiente</text>
<text x="90.0" y="598.0" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">Q70(t) = percentil 70 de r_fwd en [t − 252, t − 1]   (rolling 252, mínimo 126, shift 1)</text>
<text x="1510.0" y="598.0" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="end">umbral para comprar</text>
<text x="90.0" y="636.0" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">Q30(t) = percentil 30 de r_fwd en [t − 252, t − 1]</text>
<text x="1510.0" y="636.0" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="end">umbral para vender</text>
<text x="90.0" y="674.0" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="start" font-family="Consolas, 'Courier New', monospace">COMPRAR (2) si r_fwd(t) ≥ Q70(t) · VENDER (0) si r_fwd(t) ≤ Q30(t) · MANTENER (1) en otro caso</text>
<text x="90.0" y="716.0" font-size="13.5" fill="#6b7280" font-weight="normal" text-anchor="start">El umbral se adapta al régimen: en un año agitado los percentiles se abren; en uno tranquilo se cierran.</text>
