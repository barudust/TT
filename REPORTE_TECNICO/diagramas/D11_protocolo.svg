<text x="693.8" y="143.0" font-size="16" fill="#ffffff" font-weight="bold" text-anchor="middle">Entrenamiento</text>
<text x="693.8" y="171.0" font-size="13" fill="#ffffff" font-weight="normal" text-anchor="middle">2018–2022</text>
<rect x="1091.5" y="95.0" width="149.5" height="110.0" rx="10" fill="#a9c9f2" stroke="#2a78d6" stroke-width="1.8"/>
<text x="1166.2" y="143.0" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Época</text>
<text x="1166.2" y="171.0" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">redes</text>
<rect x="1249.0" y="95.0" width="149.5" height="110.0" rx="10" fill="#f1c36b" stroke="#c27c0e" stroke-width="1.8"/>
<text x="1323.8" y="143.0" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="middle">Configuración</text>
<text x="1323.8" y="171.0" font-size="13" fill="#1f2937" font-weight="normal" text-anchor="middle">Optuna</text>
<rect x="1406.5" y="95.0" width="149.5" height="110.0" rx="10" fill="url(#rayado)" stroke="#9aa3ae" stroke-width="1.5"/>
<rect x="1445.9" y="143.7" width="70.8" height="18.9" fill="#ffffff" rx="3"/>
<text x="1481.2" y="157.0" font-size="14" fill="#6b7280" font-weight="bold" text-anchor="middle">no se usa</text>
