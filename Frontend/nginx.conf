server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta que no sea un archivo real cae a index.html
    # (React Router maneja el resto client-side).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker no debe quedar cacheado por el navegador/proxy,
    # o las actualizaciones de la PWA no se propagan.
    location = /service-worker.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
