<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <meta name="description" content="Señales diarias de compra, mantener o venta para 7 acciones tecnológicas, generadas por Regresión Logística" />
    <title>TT 2026-B164 · Recomendaciones diarias</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // La aplicación ya no es instalable (se quitó el service worker). Los
      // navegadores que la abrieron antes todavía lo tienen registrado: se da
      // de baja y se borra su caché para que siempre carguen la versión actual.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
      }
      if ('caches' in window) {
        caches.keys().then((keys) => keys.forEach((k) => caches.delete(k)));
      }
    </script>
  </body>
</html>
